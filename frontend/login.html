<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>VersTTS - 登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* 声波条动画 */
        .sound-waves {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 200px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 4px;
            padding: 0 20px;
            opacity: 0.6;
            pointer-events: none;
        }

        .wave-bar {
            width: 6px;
            background: linear-gradient(to top, rgba(255,255,255,0.8), rgba(255,255,255,0.2));
            border-radius: 3px 3px 0 0;
            animation: wave 1.2s ease-in-out infinite;
        }

        .wave-bar:nth-child(1) { height: 20%; animation-delay: 0s; }
        .wave-bar:nth-child(2) { height: 45%; animation-delay: 0.1s; }
        .wave-bar:nth-child(3) { height: 30%; animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { height: 60%; animation-delay: 0.3s; }
        .wave-bar:nth-child(5) { height: 40%; animation-delay: 0.4s; }
        .wave-bar:nth-child(6) { height: 80%; animation-delay: 0.5s; }
        .wave-bar:nth-child(7) { height: 50%; animation-delay: 0.6s; }
        .wave-bar:nth-child(8) { height: 70%; animation-delay: 0.7s; }
        .wave-bar:nth-child(9) { height: 35%; animation-delay: 0.8s; }
        .wave-bar:nth-child(10) { height: 55%; animation-delay: 0.9s; }
        .wave-bar:nth-child(11) { height: 25%; animation-delay: 1s; }
        .wave-bar:nth-child(12) { height: 65%; animation-delay: 1.1s; }
        .wave-bar:nth-child(13) { height: 40%; animation-delay: 0.15s; }
        .wave-bar:nth-child(14) { height: 75%; animation-delay: 0.25s; }
        .wave-bar:nth-child(15) { height: 30%; animation-delay: 0.35s; }
        .wave-bar:nth-child(16) { height: 50%; animation-delay: 0.45s; }
        .wave-bar:nth-child(17) { height: 85%; animation-delay: 0.55s; }
        .wave-bar:nth-child(18) { height: 45%; animation-delay: 0.65s; }
        .wave-bar:nth-child(19) { height: 60%; animation-delay: 0.75s; }
        .wave-bar:nth-child(20) { height: 35%; animation-delay: 0.85s; }

        @keyframes wave {
            0%, 100% { transform: scaleY(0.5); opacity: 0.5; }
            50% { transform: scaleY(1); opacity: 1; }
        }

        /* 圆形声波扩散动画 */
        .sound-rings {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            pointer-events: none;
        }

        .ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            animation: ripple 3s ease-out infinite;
        }

        .ring:nth-child(1) { width: 100px; height: 100px; animation-delay: 0s; }
        .ring:nth-child(2) { width: 200px; height: 200px; animation-delay: 0.5s; }
        .ring:nth-child(3) { width: 300px; height: 300px; animation-delay: 1s; }
        .ring:nth-child(4) { width: 400px; height: 400px; animation-delay: 1.5s; }
        .ring:nth-child(5) { width: 500px; height: 500px; animation-delay: 2s; }

        @keyframes ripple {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
        }

        /* 浮动音符 */
        .floating-notes {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .note {
            position: absolute;
            font-size: 2rem;
            opacity: 0;
            animation: float 8s ease-in-out infinite;
            color: rgba(255,255,255,0.6);
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
        }

        .note:nth-child(1) { left: 10%; top: 80%; animation-delay: 0s; }
        .note:nth-child(2) { left: 20%; top: 60%; animation-delay: 1s; }
        .note:nth-child(3) { left: 80%; top: 70%; animation-delay: 2s; }
        .note:nth-child(4) { left: 70%; top: 40%; animation-delay: 3s; }
        .note:nth-child(5) { left: 15%; top: 30%; animation-delay: 4s; }
        .note:nth-child(6) { left: 85%; top: 20%; animation-delay: 5s; }
        .note:nth-child(7) { left: 50%; top: 10%; animation-delay: 6s; }
        .note:nth-child(8) { left: 30%; top: 75%; animation-delay: 7s; }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

        /* 频谱线动画 */
        .spectrum-lines {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
        }

        .spectrum-line {
            position: absolute;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
            animation: spectrum 2s ease-in-out infinite;
        }

        .spectrum-line:nth-child(1) { top: 20%; width: 30%; left: -30%; animation-delay: 0s; }
        .spectrum-line:nth-child(2) { top: 40%; width: 40%; right: -40%; animation-delay: 0.3s; }
        .spectrum-line:nth-child(3) { top: 60%; width: 25%; left: -25%; animation-delay: 0.6s; }
        .spectrum-line:nth-child(4) { top: 80%; width: 35%; right: -35%; animation-delay: 0.9s; }

        @keyframes spectrum {
            0% { transform: translateX(0); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateX(100vw); opacity: 0; }
        }

        .spectrum-line:nth-child(2),
        .spectrum-line:nth-child(4) {
            animation-name: spectrum-reverse;
        }

        @keyframes spectrum-reverse {
            0% { transform: translateX(0); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateX(-100vw); opacity: 0; }
        }

        .login-box {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 45px;
            width: 100%;
            max-width: 420px;
            box-shadow: 
                0 25px 80px rgba(0,0,0,0.2),
                0 0 0 1px rgba(255,255,255,0.3) inset,
                0 0 100px rgba(102, 126, 234, 0.15) inset;
            text-align: center;
            position: relative;
            z-index: 10;
            animation: boxPulse 4s ease-in-out infinite;
        }

        @keyframes boxPulse {
            0%, 100% { box-shadow: 0 25px 80px rgba(0,0,0,0.2), 0 0 0 1px rgba(255,255,255,0.3) inset, 0 0 100px rgba(102, 126, 234, 0.15) inset; }
            50% { box-shadow: 0 30px 100px rgba(0,0,0,0.25), 0 0 0 1px rgba(255,255,255,0.4) inset, 0 0 120px rgba(102, 126, 234, 0.25) inset; }
        }

        .login-box h2 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: #333;
        }

        .login-box p {
            color: #666;
            margin-bottom: 30px;
        }

        .login-icon {
            font-size: 3.5rem;
            margin-bottom: 15px;
            animation: iconFloat 3s ease-in-out infinite, iconGlow 2s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 20px rgba(102, 126, 234, 0.5));
        }

        @keyframes iconFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-5px) rotate(2deg); }
            75% { transform: translateY(-3px) rotate(-2deg); }
        }

        @keyframes iconGlow {
            0% { filter: drop-shadow(0 0 10px rgba(102, 126, 234, 0.3)); }
            100% { filter: drop-shadow(0 0 30px rgba(118, 75, 162, 0.6)); }
        }

        .login-input {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.9);
        }

        .login-input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 
                0 0 0 4px rgba(102, 126, 234, 0.1),
                0 4px 20px rgba(102, 126, 234, 0.15);
            transform: translateY(-2px);
        }

        .login-input:hover {
            border-color: #a0aec0;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            animation: btnBreathe 2s ease-in-out infinite;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: btnShine 3s ease-in-out infinite;
        }

        @keyframes btnBreathe {
            0%, 100% { transform: scale(1); box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3); }
            50% { transform: scale(1.02); box-shadow: 0 6px 25px rgba(102, 126, 234, 0.5); }
        }

        @keyframes btnShine {
            0% { left: -100%; }
            50%, 100% { left: 100%; }
        }

        .btn-login:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 12px 35px rgba(102, 126, 234, 0.6);
            animation: none;
        }

        .btn-login:active {
            transform: translateY(0) scale(0.98);
        }

        .login-error {
            color: #e53e3e;
            font-size: 0.9rem;
            margin-top: 10px;
            min-height: 20px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- 圆形声波扩散动画 -->
        <div class="sound-rings">
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="ring"></div>
        </div>

        <!-- 浮动音符 -->
        <div class="floating-notes">
            <div class="note">♪</div>
            <div class="note">♫</div>
            <div class="note">♬</div>
            <div class="note">♭</div>
            <div class="note">♮</div>
            <div class="note">♯</div>
            <div class="note">🎵</div>
            <div class="note">🎶</div>
        </div>

        <!-- 频谱线动画 -->
        <div class="spectrum-lines">
            <div class="spectrum-line"></div>
            <div class="spectrum-line"></div>
            <div class="spectrum-line"></div>
            <div class="spectrum-line"></div>
        </div>

        <!-- 底部声波条 -->
        <div class="sound-waves">
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
        </div>

        <div class="login-box">
            <div class="login-icon">🔐</div>
            <h2>VersTTS 登录</h2>
            <p>统一语音合成平台</p>
            <input type="text" id="loginUsername" class="login-input" placeholder="用户名" value="admin">
            <input type="password" id="loginPassword" class="login-input" placeholder="密码">
            <button class="btn-login" onclick="doLogin()">登录</button>
            <div class="login-error" id="loginError"></div>
        </div>
    </div>

    <script>
        const DEFAULT_USERNAME = 'admin';
        const DEFAULT_PASSWORD = 'tp123456';
        const AUTH_KEY = 'versTTS_auth';

        function doLogin() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const errorEl = document.getElementById('loginError');

            if (!username || !password) {
                errorEl.textContent = '请输入用户名和密码';
                return;
            }

            if (username === DEFAULT_USERNAME && password === DEFAULT_PASSWORD) {
                localStorage.setItem(AUTH_KEY, '1');
                localStorage.setItem('versTTS_username', username);
                window.location.href = 'index.html';
            } else {
                errorEl.textContent = '用户名或密码错误';
            }
        }

        // 回车键登录
        document.getElementById('loginPassword').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                doLogin();
            }
        });

        document.getElementById('loginUsername').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('loginPassword').focus();
            }
        });

        // 页面加载时检查是否已登录
        document.addEventListener('DOMContentLoaded', function() {
            const auth = localStorage.getItem(AUTH_KEY);
            if (auth === '1') {
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
