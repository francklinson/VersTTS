<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FireRedTTS2 - VersTTS</title>
    <link rel="stylesheet" href="../assets/css/common.css?v=6">
    <style>
        .fireredtts-theme { --primary-color: #e91e63; }
        .btn-generate.fireredtts { background: linear-gradient(135deg, #e91e63 0%, #c2185b 100%); }
        .btn-generate.fireredtts:hover { box-shadow: 0 8px 25px rgba(233, 30, 99, 0.4); }
        .mode-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #e0e0e0; }
        .mode-tab { padding: 12px 24px; background: none; border: none; cursor: pointer; font-size: 1rem; color: #666; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.3s; }
        .mode-tab.active { color: #e91e63; border-bottom-color: #e91e63; font-weight: 600; }
        .mode-content { display: none; }
        .mode-content.active { display: block; }
        .speaker-section { margin-bottom: 20px; padding: 15px; background: #fce4ec; border-radius: 8px; border-left: 4px solid #e91e63; }
        .speaker-select-wrapper { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
        .speaker-select { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; background: white; }
        .param-section { margin-bottom: 20px; padding: 15px; background: #fafafa; border-radius: 8px; }
        .param-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .param-item { display: flex; flex-direction: column; }
        .param-item label { font-size: 0.9rem; color: #666; margin-bottom: 5px; font-weight: 500; }
        .param-item input, .param-item select { padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
        .info-box { background: #fce4ec; border-left: 4px solid #e91e63; padding: 12px; margin-bottom: 20px; border-radius: 4px; font-size: 0.9rem; color: #880e4f; }
        .speaker-info-display { margin-top: 10px; padding: 10px; background: white; border-radius: 6px; font-size: 0.85rem; color: #666; }
        .no-speaker-warning { color: #d97706; background: #fef3c7; padding: 10px; border-radius: 6px; margin-top: 10px; font-size: 0.9rem; }
    </style>
</head>
<body class="fireredtts-theme">
    <div class="sound-waves">
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
    </div>
    <div class="floating-notes">
        <div class="note">♪</div><div class="note">♫</div><div class="note">♬</div><div class="note">♭</div>
        <div class="note">♮</div><div class="note">♯</div><div class="note">𝎼</div><div class="note">𝄢</div>
    </div>

    <div class="app-container">
        <div class="header-actions">
            <div class="health-status">
                <div class="health-dot online" id="healthDot"></div>
                <span id="healthText">在线</span>
            </div>
        </div>
        <div class="container">
            <a href="../index.html" class="nav-back">← 返回模型列表</a>
            <header>
                <h1>🔥 FireRedTTS2</h1>
                <p>长对话语音生成 - 专为播客和聊天机器人设计</p>
            </header>
            <div class="main-interface">
                <div class="model-badge"><span>🔥</span><span>FireRedTTS2</span></div>

                <div class="info-box">
                    💡 FireRedTTS2 支持 <strong>零样本声音克隆</strong> 和 <strong>随机音色生成</strong>，专为长对话场景设计。使用说话人管理模块中保存的人声进行克隆。
                </div>

                <div id="statusMessage" class="status-message"></div>

                <div class="mode-tabs">
                    <button class="mode-tab active" onclick="onSwitchMode('clone')">声音克隆</button>
                    <button class="mode-tab" onclick="onSwitchMode('random')">随机音色</button>
                </div>

                <div id="mode-clone" class="mode-content active">
                    <!-- 说话人选择区域 -->
                    <div class="speaker-section">
                        <label style="font-weight: 600; color: #880e4f; display: block; margin-bottom: 10px;">
                            🎙️ 选择说话人
                        </label>
                        <div class="speaker-select-wrapper">
                            <select id="speakerSelect" class="speaker-select" onchange="onSpeakerChange()">
                                <option value="">-- 请选择说话人 --</option>
                            </select>
                        </div>
                        <div id="speakerInfo" class="speaker-info-display" style="display: none;">
                            <!-- 动态显示说话人信息 -->
                        </div>
                        <div id="noSpeakerWarning" class="no-speaker-warning" style="display: none;">
                            ⚠️ 暂无可用说话人，请先添加说话人
                        </div>
                    </div>
                </div>

                <div id="mode-random" class="mode-content">
                    <p style="color: #666; font-size: 0.9rem;">使用随机音色生成语音，无需选择说话人</p>
                </div>

                <div class="input-section">
                    <label for="textInput">生成文本</label>
                    <textarea id="textInput" placeholder="请输入要生成语音的文本..."></textarea>
                </div>

                <div class="param-section">
                    <label style="font-weight: 600; margin-bottom: 15px; display: block;">生成参数</label>
                    <div class="param-grid">
                        <div class="param-item">
                            <label for="temperature">Temperature</label>
                            <input type="number" id="temperature" value="0.9" min="0.1" max="2.0" step="0.1">
                        </div>
                        <div class="param-item">
                            <label for="topk">Top K</label>
                            <input type="number" id="topk" value="30" min="1" max="100" step="1">
                        </div>
                    </div>
                </div>

                <button class="btn-generate fireredtts" id="generateBtn" onclick="generateTTS()">
                    <span id="btnText">🎙️ 生成语音</span>
                </button>

                <div id="resultSection" class="result-section" style="display: none;">
                    <h3>🎵 生成结果</h3>
                    <audio id="audioPlayer" class="audio-player" controls></audio>
                    <a id="downloadLink" class="btn-download" href="#" download><span>⬇️</span><span>下载音频</span></a>
                </div>
            </div>
        </div>
    </div>

    <script src="../assets/js/common.js"></script>
    <script>
        let currentMode = 'clone';
        let selectedSpeakerId = null;
        let savedSpeakers = [];

        // 切换模式
        function onSwitchMode(mode) {
            currentMode = mode;

            // 更新标签状态
            document.querySelectorAll('.mode-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');

            // 显示对应内容
            document.querySelectorAll('.mode-content').forEach(content => {
                content.classList.remove('active');
            });
            document.getElementById(`mode-${mode}`).classList.add('active');

            // 清除选择状态
            selectedSpeakerId = null;
            document.getElementById('speakerSelect').value = '';
            document.getElementById('speakerInfo').style.display = 'none';
        }

        // 加载说话人列表
        async function loadSpeakers() {
            try {
                const response = await fetch(`${VersTTS.API_BASE}/speakers`);
                if (response.ok) {
                    const data = await response.json();
                    if (data.success) {
                        savedSpeakers = data.speakers || [];
                        renderSpeakerSelect();
                    }
                }
            } catch (error) {
                console.error('加载说话人列表失败:', error);
            }
        }

        // 渲染说话人选择下拉框
        function renderSpeakerSelect() {
            const select = document.getElementById('speakerSelect');
            const noSpeakerWarning = document.getElementById('noSpeakerWarning');

            // 保留第一个选项
            select.innerHTML = '<option value="">-- 请选择说话人 --</option>';

            if (savedSpeakers.length === 0) {
                noSpeakerWarning.style.display = 'block';
                return;
            }

            noSpeakerWarning.style.display = 'none';

            savedSpeakers.forEach(speaker => {
                const option = document.createElement('option');
                option.value = speaker.id;
                option.textContent = speaker.name;
                select.appendChild(option);
            });
        }

        // 说话人选择变化处理
        function onSpeakerChange() {
            const select = document.getElementById('speakerSelect');
            const speakerInfo = document.getElementById('speakerInfo');
            selectedSpeakerId = select.value;

            if (selectedSpeakerId) {
                const speaker = savedSpeakers.find(s => s.id === selectedSpeakerId);
                if (speaker) {
                    speakerInfo.innerHTML = `
                        <strong>已选择:</strong> ${speaker.name}<br>
                        <small>创建于: ${formatDate(speaker.created_at)}</small>
                        ${speaker.reference_text ? '<br><small>参考文本: ' + speaker.reference_text.substring(0, 50) + (speaker.reference_text.length > 50 ? '...' : '') + '</small>' : ''}
                    `;
                    speakerInfo.style.display = 'block';
                }
            } else {
                speakerInfo.style.display = 'none';
            }
        }

        // 格式化日期
        function formatDate(isoString) {
            if (!isoString) return '';
            const date = new Date(isoString);
            return date.toLocaleDateString('zh-CN');
        }

        async function generateTTS() {
            const text = document.getElementById('textInput').value.trim();
            const temperature = document.getElementById('temperature').value;
            const topk = document.getElementById('topk').value;

            if (!text) {
                VersTTS.showStatus('请输入生成文本', true);
                return;
            }

            if (currentMode === 'clone' && !selectedSpeakerId) {
                VersTTS.showStatus('请选择说话人', true);
                return;
            }

            const btn = document.getElementById('generateBtn');
            const btnText = document.getElementById('btnText');
            VersTTS.setButtonLoading(btn, btnText, true);

            try {
                const formData = new FormData();
                formData.append('text', text);
                formData.append('mode', currentMode);
                formData.append('temperature', temperature);
                formData.append('topk', topk);

                if (currentMode === 'clone') {
                    formData.append('clone_speaker_id', selectedSpeakerId);
                }

                const data = await VersTTS.postForm('/tts/fireredtts', formData);

                if (data.success) {
                    VersTTS.showResult(data, { filename: `fireredtts_${Date.now()}.wav` });
                    VersTTS.showStatus('语音生成成功！');
                } else {
                    throw new Error(data.message || '生成失败');
                }
            } catch (error) {
                VersTTS.showStatus('生成失败: ' + error.message, true);
            } finally {
                VersTTS.setButtonLoading(btn, btnText, false);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            initPage();
            loadSpeakers();
        });
    </script>
</body>
</html>
