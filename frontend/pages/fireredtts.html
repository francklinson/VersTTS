<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FireRedTTS2 - VersTTS</title>
    <link rel="stylesheet" href="../assets/css/common.css?v=6">
    <style>
        .fireredtts-theme { --primary-color: #e91e63; }
        .btn-generate.fireredtts { background: linear-gradient(135deg, #e91e63 0%, #c2185b 100%); }
        .btn-generate.fireredtts:hover { box-shadow: 0 8px 25px rgba(233, 30, 99, 0.4); }
        .mode-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #e0e0e0; }
        .mode-tab { padding: 12px 24px; background: none; border: none; cursor: pointer; font-size: 1rem; color: #666; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.3s; }
        .mode-tab.active { color: #e91e63; border-bottom-color: #e91e63; font-weight: 600; }
        .mode-content { display: none; }
        .mode-content.active { display: block; }
        .ref-audio-section { margin-bottom: 20px; padding: 15px; background: #fce4ec; border-radius: 8px; border-left: 4px solid #e91e63; }
        .param-section { margin-bottom: 20px; padding: 15px; background: #fafafa; border-radius: 8px; }
        .param-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .param-item { display: flex; flex-direction: column; }
        .param-item label { font-size: 0.9rem; color: #666; margin-bottom: 5px; font-weight: 500; }
        .param-item input, .param-item select { padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
        .info-box { background: #fce4ec; border-left: 4px solid #e91e63; padding: 12px; margin-bottom: 20px; border-radius: 4px; font-size: 0.9rem; color: #880e4f; }
    </style>
</head>
<body class="fireredtts-theme">
    <div class="sound-waves">
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
    </div>
    <div class="floating-notes">
        <div class="note">♪</div><div class="note">♫</div><div class="note">♬</div><div class="note">♭</div>
        <div class="note">♮</div><div class="note">♯</div><div class="note">𝎼</div><div class="note">𝄢</div>
    </div>

    <div class="app-container">
        <div class="header-actions">
            <div class="health-status">
                <div class="health-dot online" id="healthDot"></div>
                <span id="healthText">在线</span>
            </div>
        </div>
        <div class="container">
            <a href="../index.html" class="nav-back">← 返回模型列表</a>
            <header>
                <h1>🔥 FireRedTTS2</h1>
                <p>ASLP实验室 - 高保真语音克隆</p>
            </header>
            <div class="main-interface">
                <div class="model-badge"><span>🔥</span><span>FireRedTTS2</span></div>
                
                <div class="info-box">
                    💡 FireRedTTS2 支持 <strong>少样本声音克隆</strong>，仅需5秒音频即可实现高保真语音合成，适合短视频配音场景。
                </div>
                
                <div id="statusMessage" class="status-message"></div>
                
                <!-- 模式选择 -->
                <div class="mode-tabs">
                    <button class="mode-tab active" onclick="switchMode('clone')">声音克隆</button>
                    <button class="mode-tab" onclick="switchMode('random')">随机音色</button>
                </div>
                
                <!-- 声音克隆模式 -->
                <div id="mode-clone" class="mode-content active">
                    <div class="ref-audio-section">
                        <label style="font-weight: 600; color: #880e4f; display: block; margin-bottom: 10px;">参考音频（5秒以上）</label>
                        <input type="file" id="refAudio" accept="audio/*" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
                        <p style="font-size: 0.85rem; color: #666; margin-top: 8px;">上传5秒以上的参考音频，质量越高效果越好</p>
                    </div>
                    
                    <div class="input-section">
                        <label for="refText">参考文本（可选）</label>
                        <textarea id="refText" placeholder="输入参考音频对应的文本内容..."></textarea>
                        <p style="font-size: 0.85rem; color: #666;">提供参考文本可提高克隆准确性</p>
                    </div>
                </div>
                
                <!-- 随机音色模式 -->
                <div id="mode-random" class="mode-content">
                    <p style="color: #666; font-size: 0.9rem;">使用随机音色生成语音</p>
                </div>
                
                <div class="input-section">
                    <label for="textInput">生成文本</label>
                    <textarea id="textInput" placeholder="请输入要生成语音的文本..."></textarea>
                </div>
                
                <div class="param-section">
                    <label style="font-weight: 600; margin-bottom: 15px; display: block;">生成参数</label>
                    <div class="param-grid">
                        <div class="param-item">
                            <label for="temperature">Temperature</label>
                            <input type="number" id="temperature" value="0.9" min="0.1" max="2.0" step="0.1">
                        </div>
                        <div class="param-item">
                            <label for="topk">Top K</label>
                            <input type="number" id="topk" value="30" min="1" max="100" step="1">
                        </div>
                    </div>
                </div>
                
                <button class="btn-generate fireredtts" id="generateBtn" onclick="generateTTS()">
                    <span id="btnText">🎙️ 生成语音</span>
                </button>
                
                <div id="resultSection" class="result-section" style="display: none;">
                    <h3>🎵 生成结果</h3>
                    <audio id="audioPlayer" class="audio-player" controls></audio>
                    <a id="downloadLink" class="btn-download" href="#" download><span>⬇️</span><span>下载音频</span></a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let currentMode = 'clone';
        
        function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.mode-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(`mode-${mode}`).classList.add('active');
        }
        
        async function checkHealth() {
            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                const dot = document.getElementById('healthDot');
                const text = document.getElementById('healthText');
                if (data.status === 'healthy') {
                    dot.className = 'health-dot online';
                    text.textContent = '在线';
                } else {
                    dot.className = 'health-dot offline';
                    text.textContent = '离线';
                }
            } catch (error) {
                document.getElementById('healthDot').className = 'health-dot offline';
                document.getElementById('healthText').textContent = '离线';
            }
        }
        
        function showStatus(message, isError = false) {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = `status-message show ${isError ? 'error' : 'success'}`;
            setTimeout(() => { statusEl.classList.remove('show'); }, 5000);
        }
        
        async function generateTTS() {
            const text = document.getElementById('textInput').value.trim();
            const temperature = document.getElementById('temperature').value;
            const topk = document.getElementById('topk').value;
            
            if (!text) { showStatus('请输入生成文本', true); return; }
            
            // 克隆模式需要参考音频
            if (currentMode === 'clone') {
                const refAudio = document.getElementById('refAudio').files[0];
                if (!refAudio) { showStatus('请上传参考音频', true); return; }
            }
            
            const btn = document.getElementById('generateBtn');
            const btnText = document.getElementById('btnText');
            const originalText = btnText.innerHTML;
            btn.disabled = true;
            btnText.innerHTML = '<span class="spinner"></span> 生成中...';
            
            try {
                const formData = new FormData();
                formData.append('text', text);
                formData.append('mode', currentMode);
                formData.append('temperature', temperature);
                formData.append('topk', topk);
                
                if (currentMode === 'clone') {
                    const refAudio = document.getElementById('refAudio').files[0];
                    const refText = document.getElementById('refText').value.trim();
                    formData.append('ref_audio', refAudio);
                    if (refText) formData.append('ref_text', refText);
                }
                
                const response = await fetch(`${API_BASE}/tts/fireredtts`, {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || '生成失败');
                }
                
                const data = await response.json();
                if (data.success) {
                    document.getElementById('audioPlayer').src = data.audio_url || `${API_BASE}${data.audio_url}`;
                    document.getElementById('downloadLink').href = data.audio_url || `${API_BASE}${data.audio_url}`;
                    document.getElementById('downloadLink').download = `fireredtts_${Date.now()}.wav`;
                    document.getElementById('resultSection').style.display = 'block';
                    showStatus('语音生成成功！');
                } else { 
                    throw new Error(data.message || '生成失败'); 
                }
            } catch (error) { 
                showStatus('生成失败: ' + error.message, true); 
            }
            finally { 
                btn.disabled = false; 
                btnText.innerHTML = originalText; 
            }
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            const auth = localStorage.getItem('versTTS_auth');
            if (auth !== '1') {
                window.location.href = '../login.html';
                return;
            }
            checkHealth();
        });
    </script>
</body>
</html>
