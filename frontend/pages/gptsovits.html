<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPT-SoVITS - VersTTS</title>
    <link rel="icon" type="image/svg+xml" href="../assets/logo.svg">
    <link rel="stylesheet" href="../assets/css/common.css?v=7">
    <style>
        .gptsovits-theme { --primary-color: #f44336; }
        .btn-generate.gptsovits { background: linear-gradient(135deg, #f44336 0%, #d32f2f 100%); }
        .btn-generate.gptsovits:hover { box-shadow: 0 8px 25px rgba(244, 67, 54, 0.4); }
        .btn-batch { background: linear-gradient(135deg, #ff9800 0%, #f57c00 100%); color: white; }
        .btn-batch:hover { box-shadow: 0 8px 25px rgba(255, 152, 0, 0.4); }
        .button-group { display: flex; gap: 15px; margin-bottom: 20px; }
        .button-group button { flex: 1; padding: 14px 24px; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: all 0.3s ease; }
        .batch-count-section { margin-bottom: 20px; padding: 15px; background: #fff3e0; border-radius: 8px; border-left: 4px solid #ff9800; }
        .batch-count-section label { font-weight: 600; color: #e65100; display: block; margin-bottom: 10px; }
        .batch-count-input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; }
        .speaker-section { margin-bottom: 20px; padding: 15px; background: #ffebee; border-radius: 8px; border-left: 4px solid #f44336; }
        .speaker-select-wrapper { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
        .speaker-select { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; background: white; }
        .param-section { margin-bottom: 20px; padding: 15px; background: #fafafa; border-radius: 8px; }
        .param-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .param-item { display: flex; flex-direction: column; }
        .param-item label { font-size: 0.9rem; color: #666; margin-bottom: 5px; font-weight: 500; }
        .param-item input, .param-item select { padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
        .info-box { background: #ffebee; border-left: 4px solid #f44336; padding: 12px; margin-bottom: 20px; border-radius: 4px; font-size: 0.9rem; color: #c62828; }
        .speaker-info-display { margin-top: 10px; padding: 10px; background: white; border-radius: 6px; font-size: 0.85rem; color: #666; }
        .no-speaker-warning { color: #d97706; background: #fef3c7; padding: 10px; border-radius: 6px; margin-top: 10px; font-size: 0.9rem; }
        .version-info { margin-top: 12px; padding: 12px 15px; background: #fff3e0; border-left: 4px solid #ff9800; border-radius: 6px; font-size: 0.85rem; color: #555; line-height: 1.7; }
        .version-info .vi-tag { display: inline-block; background: #ff9800; color: white; padding: 1px 8px; border-radius: 3px; font-size: 0.78rem; margin-right: 4px; }
        .version-info .vi-tag.sr { background: #4caf50; }
        .version-info .vi-tag.lang { background: #2196f3; }
        .version-info .vi-tag.vocoder { background: #9c27b0; }
    </style>
</head>
<body class="gptsovits-theme">
    <div class="sound-waves">
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
    </div>
    <div class="floating-notes">
        <div class="note">♪</div><div class="note">♫</div><div class="note">♬</div><div class="note">♭</div>
        <div class="note">♮</div><div class="note">♯</div><div class="note">𝎼</div><div class="note">𝄢</div>
    </div>

    <div class="app-container">
        <div class="header-actions">
            <div class="health-status">
                <div class="health-dot online" id="healthDot"></div>
                <span id="healthText">在线</span>
            </div>
        </div>
        <div class="container">
            <a href="../index.html" class="nav-back">← 返回模型列表</a>
            <header>
                <h1>🔥 GPT-SoVITS</h1>
                <p>RVC开发者推荐 - 少样本语音克隆</p>
            </header>
            <div class="main-interface">
                <div class="model-badge"><span>🔥</span><span>GPT-SoVITS</span></div>

                <div class="info-box">
                    💡 GPT-SoVITS 仅需 <strong>5秒音频</strong> 即可实现高质量声音克隆。支持多说话人和多种语言。
                    <strong>使用说话人管理模块中保存的人声</strong>进行克隆。
                </div>

                <div id="statusMessage" class="status-message"></div>

                <!-- 说话人选择区域 -->
                <div class="speaker-section">
                    <label style="font-weight: 600; color: #c62828; display: block; margin-bottom: 10px;">
                        🎙️ 选择说话人
                    </label>
                    <div class="speaker-select-wrapper">
                        <select id="speakerSelect" class="speaker-select" onchange="onSpeakerChange()">
                            <option value="">-- 请选择说话人 --</option>
                        </select>
                    </div>
                    <div id="speakerInfo" class="speaker-info-display" style="display: none;">
                        <!-- 动态显示说话人信息 -->
                    </div>
                    <div id="noSpeakerWarning" class="no-speaker-warning" style="display: none;">
                        ⚠️ 暂无可用说话人，请先添加说话人
                    </div>
                </div>

                <div class="input-section">
                    <label for="genText">生成文本</label>
                    <textarea id="genText" placeholder="请输入要生成语音的文本..."></textarea>
                </div>

                <div class="param-section">
                    <label style="font-weight: 600; margin-bottom: 15px; display: block;">生成参数</label>
                    <div class="param-grid">
                        <div class="param-item">
                            <label for="version">模型版本</label>
                            <select id="version" onchange="onVersionChange()">
                                <option value="v2">V2（推荐）</option>
                                <option value="v1">V1</option>
                                <option value="v2Pro">V2 Pro</option>
                                <option value="v2ProPlus">V2 Pro+</option>
                                <option value="v3">V3</option>
                                <option value="v4">V4</option>
                            </select>
                        </div>
                        <div class="param-item">
                            <label for="textLang">文本语言</label>
                            <select id="textLang">
                                <option value="zh">中文</option>
                                <option value="en">英文</option>
                                <option value="ja">日文</option>
                                <option value="ko">韩文</option>
                                <option value="yue">粤语</option>
                            </select>
                        </div>
                        <div class="param-item">
                            <label for="promptLang">参考音频语言</label>
                            <select id="promptLang">
                                <option value="zh">中文</option>
                                <option value="en">英文</option>
                                <option value="ja">日文</option>
                                <option value="ko">韩文</option>
                                <option value="yue">粤语</option>
                            </select>
                        </div>
                        <div class="param-item">
                            <label for="topK">Top K</label>
                            <input type="number" id="topK" value="15" min="1" max="100" step="1">
                        </div>
                        <div class="param-item">
                            <label for="topP">Top P</label>
                            <input type="number" id="topP" value="1.0" min="0.1" max="1.0" step="0.1">
                        </div>
                        <div class="param-item">
                            <label for="temperature">Temperature</label>
                            <input type="number" id="temperature" value="1.0" min="0.1" max="2.0" step="0.1">
                        </div>
                        <div class="param-item">
                            <label for="speedFactor">语速</label>
                            <input type="number" id="speedFactor" value="1.0" min="0.5" max="2.0" step="0.1">
                        </div>
                        <div class="param-item">
                            <label for="batchSize">批大小</label>
                            <input type="number" id="batchSize" value="1" min="1" max="10" step="1">
                        </div>
                        <div class="param-item">
                            <label for="textSplitMethod">文本切分</label>
                            <select id="textSplitMethod">
                                <option value="cut0">不切分</option>
                                <option value="cut1">按句号切分</option>
                                <option value="cut2">按逗号切分</option>
                                <option value="cut3">按标点切分</option>
                                <option value="cut4">按长度切分</option>
                                <option value="cut5" selected>智能切分</option>
                            </select>
                        </div>
                    </div>
                    <div id="versionInfo" class="version-info" style="display:none;"></div>
                </div>

                <!-- 批量生成数量设置 -->
                <div class="batch-count-section">
                    <label>🎲 批量生成数量</label>
                    <input type="number" id="batchCount" class="batch-count-input" value="10" min="2" max="100">
                    <p style="font-size: 0.85rem; color: #666; margin-top: 8px;">一次生成多个音频变体，可选择最佳结果（2-100个）</p>
                </div>

                <div class="button-group">
                    <button class="btn-generate gptsovits" id="generateBtn" onclick="addToQueue()">
                        <span id="btnText">🎙️ 生成语音</span>
                    </button>
                    <button class="btn-batch" id="batchGenerateBtn" onclick="batchGenerateTTS()">
                        <span id="batchBtnText">🎲 批量生成</span>
                    </button>
                </div>
                <p style="font-size: 0.85rem; color: #666; margin-top: 8px;">
                    💡 点击"生成语音"将自动加入任务队列
                </p>
                <div style="margin-top: 10px;">
                    <button class="btn-secondary" onclick="window.location.href='tasks.html'" style="background: #f0f0f0; color: #333; padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer;">
                        📋 查看任务队列
                    </button>
                </div>

                <div id="resultSection" class="result-section" style="display: none;">
                    <h3>🎵 生成结果</h3>
                    <audio id="audioPlayer" class="audio-player" controls></audio>
                    <a id="downloadLink" class="btn-download" href="#" download><span>⬇️</span><span>下载音频</span></a>
                </div>

                <!-- 批量生成结果 -->
                <div id="batchResultSection" style="display: none;">
                    <h3>🎲 批量生成结果</h3>
                    <div id="batchResults" class="batch-results"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="../assets/js/common.js"></script>
    <script>
        let selectedSpeakerId = null;
        let savedSpeakers = [];

        // 版本信息映射
        const VERSION_INFO = {
            v1: {
                name: 'V1',
                desc: '初代版本，训练数据较少，仅支持中/英/日三语',
                sr: '32kHz',
                langs: '中/英/日',
                vocoder: '内置HiFi-GAN',
                note: '适合简单场景，质量低于V2',
            },
            v2: {
                name: 'V2',
                desc: '主力版本，训练数据大幅增加，质量稳定可靠',
                sr: '32kHz',
                langs: '中/英/日/粤/韩',
                vocoder: '内置HiFi-GAN',
                note: '综合表现最佳，推荐日常使用',
            },
            v2Pro: {
                name: 'V2 Pro',
                desc: 'V2增强版，引入说话人验证(SV)嵌入，提升音色一致性',
                sr: '32kHz',
                langs: '中/英/日/粤/韩',
                vocoder: '内置HiFi-GAN + SV',
                note: '多说话人场景音色更稳定',
            },
            v2ProPlus: {
                name: 'V2 Pro+',
                desc: 'V2增强版Plus，更强的SV嵌入模型，音色保真度更高',
                sr: '32kHz',
                langs: '中/英/日/粤/韩',
                vocoder: '内置HiFi-GAN + SV',
                note: '音色还原度最高的V2系版本',
            },
            v3: {
                name: 'V3',
                desc: '第三代架构，使用BigVGAN声码器，音频质量提升',
                sr: '24kHz',
                langs: '中/英/日/粤/韩',
                vocoder: 'BigVGAN',
                note: '音质更自然，但采样率较低',
            },
            v4: {
                name: 'V4',
                desc: '最新第四代，自研声码器，采样率最高',
                sr: '48kHz',
                langs: '中/英/日/粤/韩',
                vocoder: '自研Generator',
                note: '最高音质，推荐对音质有要求的场景',
            },
        };

        function onVersionChange() {
            const ver = document.getElementById('version').value;
            const box = document.getElementById('versionInfo');
            const info = VERSION_INFO[ver];
            if (!info) { box.style.display = 'none'; return; }
            box.innerHTML = `
                <strong>${info.name}</strong>：${info.desc}<br>
                <span class="vi-tag sr">采样率 ${info.sr}</span>
                <span class="vi-tag lang">${info.langs}</span>
                <span class="vi-tag vocoder">${info.vocoder}</span><br>
                <span style="color:#e65100;">💡 ${info.note}</span>
            `;
            box.style.display = 'block';
        }

        // 加载说话人列表
        async function loadSpeakers() {
            try {
                const response = await fetch(`${VersTTS.API_BASE}/speakers`);
                if (response.ok) {
                    const data = await response.json();
                    if (data.success) {
                        savedSpeakers = data.speakers || [];
                        renderSpeakerSelect();
                    }
                }
            } catch (error) {
                console.error('加载说话人列表失败:', error);
            }
        }

        // 渲染说话人选择下拉框
        function renderSpeakerSelect() {
            const select = document.getElementById('speakerSelect');
            const noSpeakerWarning = document.getElementById('noSpeakerWarning');

            // 保留第一个选项
            select.innerHTML = '<option value="">-- 请选择说话人 --</option>';

            if (savedSpeakers.length === 0) {
                noSpeakerWarning.style.display = 'block';
                return;
            }

            noSpeakerWarning.style.display = 'none';

            savedSpeakers.forEach(speaker => {
                const option = document.createElement('option');
                option.value = speaker.id;
                option.textContent = speaker.name;
                select.appendChild(option);
            });
        }

        // 说话人选择变化处理
        function onSpeakerChange() {
            const select = document.getElementById('speakerSelect');
            const speakerInfo = document.getElementById('speakerInfo');
            selectedSpeakerId = select.value;

            if (selectedSpeakerId) {
                const speaker = savedSpeakers.find(s => s.id === selectedSpeakerId);
                if (speaker) {
                    speakerInfo.innerHTML = `
                        <strong>已选择:</strong> ${speaker.name}<br>
                        <small>创建于: ${formatDate(speaker.created_at)}</small>
                        ${speaker.reference_text ? '<br><small>参考文本: ' + speaker.reference_text.substring(0, 50) + (speaker.reference_text.length > 50 ? '...' : '') + '</small>' : ''}
                    `;
                    speakerInfo.style.display = 'block';
                }
            } else {
                speakerInfo.style.display = 'none';
            }
        }

        // 格式化日期
        function formatDate(isoString) {
            if (!isoString) return '';
            const date = new Date(isoString);
            return date.toLocaleDateString('zh-CN');
        }

        // 当前正在轮询的任务ID
        let pollingTaskId = null;
        let pollingInterval = null;

        // 添加到任务队列
        async function addToQueue() {
            const genText = document.getElementById('genText').value.trim();

            if (!selectedSpeakerId) {
                VersTTS.showStatus('请选择说话人', true);
                return;
            }
            if (!genText) {
                VersTTS.showStatus('请输入生成文本', true);
                return;
            }

            const btn = document.getElementById('generateBtn');
            const btnText = document.getElementById('btnText');
            VersTTS.setButtonLoading(btn, btnText, true);

            try {
                const formData = new FormData();
                formData.append('model', 'gptsovits');
                formData.append('mode', 'clone');
                formData.append('text', genText);
                formData.append('speaker_id', selectedSpeakerId);
                formData.append('version', document.getElementById('version').value);

                const response = await fetch(`${VersTTS.API_BASE}/tasks/submit`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    const queueMsg = data.queue_position !== null ? ` (队列位置: ${data.queue_position + 1})` : '';
                    VersTTS.showStatus(`已加入生成队列${queueMsg}，生成完成后将自动显示结果...`);
                    startPollingTask(data.task_id);
                } else {
                    throw new Error(data.message || '提交失败');
                }
            } catch (error) {
                VersTTS.showStatus('提交任务失败: ' + error.message, true);
            } finally {
                VersTTS.setButtonLoading(btn, btnText, false);
            }
        }

        // 批量生成
        async function batchGenerateTTS() {
            const genText = document.getElementById('genText').value.trim();
            const batchCount = parseInt(document.getElementById('batchCount').value) || 10;

            if (!selectedSpeakerId) {
                VersTTS.showStatus('请选择说话人', true);
                return;
            }
            if (!genText) {
                VersTTS.showStatus('请输入生成文本', true);
                return;
            }
            if (batchCount < 2) {
                VersTTS.showStatus('批量生成数量至少为2', true);
                return;
            }

            const btn = document.getElementById('batchGenerateBtn');
            const btnText = document.getElementById('batchBtnText');
            VersTTS.setButtonLoading(btn, btnText, true);

            try {
                const formData = new FormData();
                formData.append('model', 'gptsovits');
                formData.append('mode', 'clone');
                formData.append('text', genText);
                formData.append('speaker_id', selectedSpeakerId);
                formData.append('version', document.getElementById('version').value);
                formData.append('batch_count', batchCount);

                const response = await fetch(`${VersTTS.API_BASE}/tasks/submit`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    startPollingTask(data.task_id);
                } else {
                    throw new Error(data.message || '提交失败');
                }
            } catch (error) {
                VersTTS.showStatus('批量提交失败: ' + error.message, true);
            } finally {
                VersTTS.setButtonLoading(btn, btnText, false);
            }
        }

        // 开始轮询任务状态
        function startPollingTask(taskId) {
            stopPollingTask();
            pollingTaskId = taskId;
            let retryCount = 0;
            const maxRetries = 300;

            const resultSection = document.getElementById('resultSection');
            const audioPlayer = document.getElementById('audioPlayer');
            const downloadLink = document.getElementById('downloadLink');
            if (audioPlayer) audioPlayer.style.display = 'none';
            if (downloadLink) downloadLink.style.display = 'none';
            resultSection.style.display = 'block';
            let statusEl = document.getElementById('queueGenStatus');
            if (!statusEl) {
                statusEl = document.createElement('div');
                statusEl.id = 'queueGenStatus';
                statusEl.style.cssText = 'margin:10px 0;padding:12px 16px;background:#ffebee;border-radius:8px;color:#c62828;font-size:0.9rem;';
                resultSection.insertBefore(statusEl, resultSection.children[1] || null);
            }
            statusEl.style.display = 'block';
            statusEl.innerHTML = '⏳ 任务已提交到队列，正在等待执行...';
            resultSection.scrollIntoView({ behavior: 'smooth' });

            pollingInterval = setInterval(async () => {
                if (retryCount >= maxRetries) {
                    stopPollingTask();
                    if (statusEl) {
                        statusEl.innerHTML = '⏱️ 任务超时，请到<a href="tasks.html">任务队列</a>页面查看结果';
                        statusEl.style.background = '#fff3e0';
                        statusEl.style.color = '#e65100';
                    }
                    return;
                }
                retryCount++;

                try {
                    const resp = await fetch(`${VersTTS.API_BASE}/tasks/${taskId}/status`);
                    const data = await resp.json();

                    if (!data.success) {
                        stopPollingTask();
                        statusEl.innerHTML = '❌ 查询任务状态失败';
                        statusEl.style.background = '#ffebee';
                        return;
                    }

                    if (data.status === 'completed') {
                        stopPollingTask();
                        statusEl.style.display = 'none';

                        if (data.batch_results && data.batch_results.length > 0) {
                            // 批量结果
                            VersTTS.showStatus(`批量生成完成！共 ${data.batch_results.length} 个音频`);
                        } else if (data.audio_url) {
                            // 单个结果
                            audioPlayer.src = data.audio_url;
                            audioPlayer.style.display = 'block';
                            downloadLink.href = data.audio_url;
                            downloadLink.download = `gptsovits_${Date.now()}.wav`;
                            downloadLink.style.display = 'inline-flex';
                            VersTTS.showStatus('语音生成成功！');
                        }
                    } else if (data.status === 'failed') {
                        stopPollingTask();
                        statusEl.innerHTML = `❌ 生成失败: ${data.error_message || '未知错误'}`;
                        statusEl.style.background = '#ffebee';
                        statusEl.style.color = '#c62828';
                    } else if (data.status === 'processing') {
                        const batchInfo = data.batch_total > 1 ? ` (${data.batch_completed || 0}/${data.batch_total})` : '';
                        statusEl.innerHTML = `🔄 正在生成${batchInfo}...`;
                        statusEl.style.background = '#e3f2fd';
                        statusEl.style.color = '#1565c0';
                    } else if (data.status === 'queued') {
                        statusEl.innerHTML = '⏳ 任务排队中，请稍候...';
                    }
                } catch (e) {
                    console.error('轮询任务状态失败:', e);
                }
            }, 2000);
        }

        function stopPollingTask() {
            if (pollingInterval) {
                clearInterval(pollingInterval);
                pollingInterval = null;
            }
            pollingTaskId = null;
        }

        document.addEventListener('DOMContentLoaded', () => {
            initPage();
            loadSpeakers();
            onVersionChange();
        });
    </script>
</body>
</html>
