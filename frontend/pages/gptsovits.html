<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPT-SoVITS - VersTTS</title>
    <link rel="stylesheet" href="../assets/css/common.css?v=6">
    <style>
        .gptsovits-theme { --primary-color: #f44336; }
        .btn-generate.gptsovits { background: linear-gradient(135deg, #f44336 0%, #d32f2f 100%); }
        .btn-generate.gptsovits:hover { box-shadow: 0 8px 25px rgba(244, 67, 54, 0.4); }
        .ref-audio-section { margin-bottom: 20px; padding: 15px; background: #ffebee; border-radius: 8px; border-left: 4px solid #f44336; }
        .param-section { margin-bottom: 20px; padding: 15px; background: #fafafa; border-radius: 8px; }
        .param-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .param-item { display: flex; flex-direction: column; }
        .param-item label { font-size: 0.9rem; color: #666; margin-bottom: 5px; font-weight: 500; }
        .param-item input, .param-item select { padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
        .lang-selector { display: flex; gap: 15px; margin-bottom: 20px; }
        .lang-option { display: flex; align-items: center; gap: 5px; }
        .info-box { background: #ffebee; border-left: 4px solid #f44336; padding: 12px; margin-bottom: 20px; border-radius: 4px; font-size: 0.9rem; color: #c62828; }
    </style>
</head>
<body class="gptsovits-theme">
    <div class="sound-waves">
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
    </div>
    <div class="floating-notes">
        <div class="note">♪</div><div class="note">♫</div><div class="note">♬</div><div class="note">♭</div>
        <div class="note">♮</div><div class="note">♯</div><div class="note">𝎼</div><div class="note">𝄢</div>
    </div>

    <div class="app-container">
        <div class="header-actions">
            <div class="health-status">
                <div class="health-dot online" id="healthDot"></div>
                <span id="healthText">在线</span>
            </div>
        </div>
        <div class="container">
            <a href="../index.html" class="nav-back">← 返回模型列表</a>
            <header>
                <h1>🔥 GPT-SoVITS</h1>
                <p>RVC开发者推荐 - 少样本语音克隆</p>
            </header>
            <div class="main-interface">
                <div class="model-badge"><span>🔥</span><span>GPT-SoVITS</span></div>
                
                <div class="info-box">
                    💡 GPT-SoVITS 仅需要 <strong>5秒音频</strong> 即可实现高质量声音克隆。支持多说话人和多种语言。
                </div>
                
                <div id="statusMessage" class="status-message"></div>
                
                <div class="ref-audio-section">
                    <label style="font-weight: 600; color: #c62828; display: block; margin-bottom: 10px;">参考音频（5秒以上）</label>
                    <input type="file" id="promptWav" accept="audio/*" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
                    <p style="font-size: 0.85rem; color: #666; margin-top: 8px;">
                        上传5秒以上的参考音频，质量越高效果越好
                    </p>
                </div>
                
                <div class="input-section">
                    <label for="promptText">参考文本（必须）</label>
                    <textarea id="promptText" placeholder="输入参考音频对应的文本内容..."></textarea>
                </div>
                
                <div class="input-section">
                    <label for="genText">生成文本</label>
                    <textarea id="genText" placeholder="请输入要生成语音的文本..."></textarea>
                </div>
                
                <div class="param-section">
                    <label style="font-weight: 600; margin-bottom: 15px; display: block;">生成参数</label>
                    <div class="param-grid">
                        <div class="param-item">
                            <label for="version">模型版本</label>
                            <select id="version">
                                <option value="v2">V2（推荐）</option>
                                <option value="v1">V1</option>
                            </select>
                        </div>
                        <div class="param-item">
                            <label for="textLang">文本语言</label>
                            <select id="textLang">
                                <option value="zh">中文</option>
                                <option value="en">英文</option>
                                <option value="ja">日文</option>
                                <option value="ko">韩文</option>
                                <option value="yue">粤语</option>
                            </select>
                        </div>
                        <div class="param-item">
                            <label for="promptLang">参考音频语言</label>
                            <select id="promptLang">
                                <option value="zh">中文</option>
                                <option value="en">英文</option>
                                <option value="ja">日文</option>
                                <option value="ko">韩文</option>
                                <option value="yue">粤语</option>
                            </select>
                        </div>
                        <div class="param-item">
                            <label for="topK">Top K</label>
                            <input type="number" id="topK" value="15" min="1" max="100" step="1">
                        </div>
                        <div class="param-item">
                            <label for="topP">Top P</label>
                            <input type="number" id="topP" value="1.0" min="0.1" max="1.0" step="0.1">
                        </div>
                        <div class="param-item">
                            <label for="temperature">Temperature</label>
                            <input type="number" id="temperature" value="1.0" min="0.1" max="2.0" step="0.1">
                        </div>
                        <div class="param-item">
                            <label for="speedFactor">语速</label>
                            <input type="number" id="speedFactor" value="1.0" min="0.5" max="2.0" step="0.1">
                        </div>
                        <div class="param-item">
                            <label for="batchSize">批大小</label>
                            <input type="number" id="batchSize" value="1" min="1" max="10" step="1">
                        </div>
                        <div class="param-item">
                            <label for="textSplitMethod">文本切分</label>
                            <select id="textSplitMethod">
                                <option value="cut0">不切分</option>
                                <option value="cut1">按句号切分</option>
                                <option value="cut2">按逗号切分</option>
                                <option value="cut3">按标点切分</option>
                                <option value="cut4">按长度切分</option>
                                <option value="cut5" selected>智能切分</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <button class="btn-generate gptsovits" id="generateBtn" onclick="generateTTS()">
                    <span id="btnText">🎙️ 生成语音</span>
                </button>
                
                <div id="resultSection" class="result-section" style="display: none;">
                    <h3>🎵 生成结果</h3>
                    <audio id="audioPlayer" class="audio-player" controls></audio>
                    <a id="downloadLink" class="btn-download" href="#" download><span>⬇️</span><span>下载音频</span></a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        
        async function checkHealth() {
            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                const dot = document.getElementById('healthDot');
                const text = document.getElementById('healthText');
                if (data.status === 'healthy') {
                    dot.className = 'health-dot online';
                    text.textContent = '在线';
                } else {
                    dot.className = 'health-dot offline';
                    text.textContent = '离线';
                }
            } catch (error) {
                document.getElementById('healthDot').className = 'health-dot offline';
                document.getElementById('healthText').textContent = '离线';
            }
        }
        
        function showStatus(message, isError = false) {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = `status-message show ${isError ? 'error' : 'success'}`;
            setTimeout(() => { statusEl.classList.remove('show'); }, 5000);
        }
        
        async function generateTTS() {
            const genText = document.getElementById('genText').value.trim();
            const promptText = document.getElementById('promptText').value.trim();
            const promptWav = document.getElementById('promptWav').files[0];
            
            const textLang = document.getElementById('textLang').value;
            const promptLang = document.getElementById('promptLang').value;
            const topK = document.getElementById('topK').value;
            const topP = document.getElementById('topP').value;
            const temperature = document.getElementById('temperature').value;
            const speedFactor = document.getElementById('speedFactor').value;
            const batchSize = document.getElementById('batchSize').value;
            const textSplitMethod = document.getElementById('textSplitMethod').value;
            const version = document.getElementById('version').value;
            
            if (!genText) { showStatus('请输入生成文本', true); return; }
            if (!promptText) { showStatus('请输入参考文本', true); return; }
            if (!promptWav) { showStatus('请上传参考音频', true); return; }
            
            const btn = document.getElementById('generateBtn');
            const btnText = document.getElementById('btnText');
            const originalText = btnText.innerHTML;
            btn.disabled = true;
            btnText.innerHTML = '<span class="spinner"></span> 生成中...';
            
            try {
                const formData = new FormData();
                formData.append('text', genText);
                formData.append('text_lang', textLang);
                formData.append('prompt_wav', promptWav);
                formData.append('prompt_text', promptText);
                formData.append('prompt_lang', promptLang);
                formData.append('top_k', topK);
                formData.append('top_p', topP);
                formData.append('temperature', temperature);
                formData.append('text_split_method', textSplitMethod);
                formData.append('batch_size', batchSize);
                formData.append('speed_factor', speedFactor);
                formData.append('version', version);
                
                const response = await fetch(`${API_BASE}/tts/gptsovits`, {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || '生成失败');
                }
                
                const data = await response.json();
                if (data.success) {
                    document.getElementById('audioPlayer').src = data.audio_url || `${API_BASE}${data.audio_url}`;
                    document.getElementById('downloadLink').href = data.audio_url || `${API_BASE}${data.audio_url}`;
                    document.getElementById('downloadLink').download = `gptsovits_${Date.now()}.wav`;
                    document.getElementById('resultSection').style.display = 'block';
                    showStatus('语音生成成功！');
                } else { 
                    throw new Error(data.message || '生成失败'); 
                }
            } catch (error) { 
                showStatus('生成失败: ' + error.message, true); 
            }
            finally { 
                btn.disabled = false; 
                btnText.innerHTML = originalText; 
            }
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            const auth = localStorage.getItem('versTTS_auth');
            if (auth !== '1') {
                window.location.href = '../login.html';
                return;
            }
            checkHealth();
        });
    </script>
</body>
</html>
