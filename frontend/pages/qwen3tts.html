<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qwen3-TTS - VersTTS</title>
    <link rel="stylesheet" href="../assets/css/common.css?v=6">
    <style>
        .qwen3tts-theme { --primary-color: #ff6b35; }
        .btn-generate.qwen3tts { background: linear-gradient(135deg, #ff6b35 0%, #e55a2b 100%); }
        .btn-generate.qwen3tts:hover { box-shadow: 0 8px 25px rgba(255, 107, 53, 0.4); }
        .mode-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #e0e0e0; flex-wrap: wrap; }
        .mode-tab { padding: 10px 20px; background: none; border: none; cursor: pointer; font-size: 0.95rem; color: #666; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.3s; }
        .mode-tab.active { color: #ff6b35; border-bottom-color: #ff6b35; font-weight: 600; }
        .mode-content { display: none; }
        .mode-content.active { display: block; }
        .speaker-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .speaker-card { padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; cursor: pointer; text-align: center; transition: all 0.3s; }
        .speaker-card:hover { border-color: #ff6b35; background: #fff5f2; }
        .speaker-card.selected { border-color: #ff6b35; background: #ff6b35; color: white; }
        .ref-audio-section { margin-bottom: 20px; padding: 15px; background: #fff5f2; border-radius: 8px; border-left: 4px solid #ff6b35; }
        .info-box { background: #fff5f2; border-left: 4px solid #ff6b35; padding: 12px; margin-bottom: 20px; border-radius: 4px; font-size: 0.9rem; color: #d84315; }
        .param-section { margin-bottom: 20px; padding: 15px; background: #fafafa; border-radius: 8px; }
        .model-size-selector { display: flex; gap: 15px; margin-bottom: 20px; }
        .model-size-option { display: flex; align-items: center; gap: 5px; cursor: pointer; }
    </style>
</head>
<body class="qwen3tts-theme">
    <div class="sound-waves">
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
    </div>
    <div class="floating-notes">
        <div class="note">♪</div><div class="note">♫</div><div class="note">♬</div><div class="note">♭</div>
        <div class="note">♮</div><div class="note">♯</div><div class="note">𝄞</div><div class="note">𝄢</div>
    </div>

    <div class="app-container">
        <div class="header-actions">
            <div class="health-status">
                <div class="health-dot online" id="healthDot"></div>
                <span id="healthText">在线</span>
            </div>
        </div>
        <div class="container">
            <a href="../index.html" class="nav-back">← 返回模型列表</a>
            <header>
                <h1>🐝 Qwen3-TTS</h1>
                <p>阿里通义千问 - 30种语言多说话人合成</p>
            </header>
            <div class="main-interface">
                <div class="model-badge"><span>🐝</span><span>Qwen3-TTS</span></div>

                <div class="info-box">
                    💡 Qwen3-TTS 支持 9 种预设音色和 4 种工作模式。支持 30+ 种语言。
                </div>

                <div id="statusMessage" class="status-message"></div>

                <div class="param-section">
                    <label style="font-weight: 600; margin-bottom: 10px; display: block;">模型大小</label>
                    <div class="model-size-selector">
                        <label class="model-size-option">
                            <input type="radio" name="modelSize" value="0.6B" checked>
                            <span>0.6B (快速)</span>
                        </label>
                        <label class="model-size-option">
                            <input type="radio" name="modelSize" value="1.7B">
                            <span>1.7B (高质量)</span>
                        </label>
                    </div>
                </div>

                <div class="mode-tabs">
                    <button class="mode-tab active" onclick="switchMode('base')">基础生成</button>
                    <button class="mode-tab" onclick="switchMode('voice_clone')">声音克隆</button>
                    <button class="mode-tab" onclick="switchMode('custom_voice')">预设音色</button>
                    <button class="mode-tab" onclick="switchMode('voice_design')">音色设计</button>
                </div>

                <div id="mode-base" class="mode-content active">
                    <p style="color: #666; font-size: 0.9rem;">使用默认音色生成语音</p>
                </div>

                <div id="mode-voice_clone" class="mode-content">
                    <div class="ref-audio-section">
                        <label style="font-weight: 600; color: #d84315; display: block; margin-bottom: 10px;">参考音频</label>
                        <input type="file" id="refAudio" accept="audio/*" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
                    </div>
                    <div class="input-section">
                        <label for="refText">参考文本（可选）</label>
                        <textarea id="refText" placeholder="输入参考音频对应的文本内容..."></textarea>
                    </div>
                </div>

                <div id="mode-custom_voice" class="mode-content">
                    <div class="param-section">
                        <label style="font-weight: 600; margin-bottom: 10px; display: block;">选择预设音色</label>
                        <div class="speaker-grid" id="speakerGrid">
                            <div class="speaker-card" data-speaker="Vivian">Vivian<br><small>女声</small></div>
                            <div class="speaker-card" data-speaker="Serena">Serena<br><small>女声</small></div>
                            <div class="speaker-card" data-speaker="Uncle_Fu">Uncle_Fu<br><small>男声</small></div>
                            <div class="speaker-card" data-speaker="Dylan">Dylan<br><small>男声</small></div>
                            <div class="speaker-card" data-speaker="Eric">Eric<br><small>男声</small></div>
                            <div class="speaker-card" data-speaker="Ryan">Ryan<br><small>男声</small></div>
                            <div class="speaker-card" data-speaker="Aiden">Aiden<br><small>男声</small></div>
                            <div class="speaker-card" data-speaker="Ono_Anna">Ono_Anna<br><small>女声</small></div>
                            <div class="speaker-card" data-speaker="Sohee">Sohee<br><small>女声</small></div>
                        </div>
                        <p style="font-size: 0.85rem; color: #666;">点击选择一种预设音色</p>
                    </div>
                </div>

                <div id="mode-voice_design" class="mode-content">
                    <div class="param-section">
                        <label style="font-weight: 600; margin-bottom: 10px; display: block;">音色描述</label>
                        <input type="text" id="voiceDesignPrompt" placeholder="例如：一个温柔的女声，说话缓慢清晰" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
                        <p style="font-size: 0.85rem; color: #666; margin-top: 8px;">用自然语言描述你想要的音色特征</p>
                    </div>
                </div>

                <div class="input-section">
                    <label for="genText">生成文本</label>
                    <textarea id="genText" placeholder="请输入要生成语音的文本，支持30+种语言..."></textarea>
                </div>

                <div class="param-section">
                    <label style="font-weight: 600; margin-bottom: 10px; display: block;">指令控制（可选）</label>
                    <input type="text" id="instructText" placeholder="例如：用开心的语气说、用四川话慢慢说" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
                </div>

                <button class="btn-generate qwen3tts" id="generateBtn" onclick="generateTTS()">
                    <span id="btnText">🎙️ 生成语音</span>
                </button>

                <div id="resultSection" class="result-section" style="display: none;">
                    <h3>🎵 生成结果</h3>
                    <audio id="audioPlayer" class="audio-player" controls></audio>
                    <a id="downloadLink" class="btn-download" href="#" download><span>⬇️</span><span>下载音频</span></a>
                </div>
            </div>
        </div>
    </div>

    <script src="../assets/js/common.js"></script>
    <script>
        let currentMode = 'base';
        let selectedSpeaker = null;

        // 选择音色
        document.querySelectorAll('.speaker-card').forEach(card => {
            card.addEventListener('click', function() {
                document.querySelectorAll('.speaker-card').forEach(c => c.classList.remove('selected'));
                this.classList.add('selected');
                selectedSpeaker = this.dataset.speaker;
            });
        });

        async function generateTTS() {
            const genText = document.getElementById('genText').value.trim();
            const instructText = document.getElementById('instructText').value.trim();
            const modelSize = document.querySelector('input[name="modelSize"]:checked').value;

            if (!genText) { VersTTS.showStatus('请输入生成文本', true); return; }

            if (currentMode === 'custom_voice' && !selectedSpeaker) {
                VersTTS.showStatus('请选择一种预设音色', true);
                return;
            }
            if (currentMode === 'voice_design' && !document.getElementById('voiceDesignPrompt').value.trim()) {
                VersTTS.showStatus('请输入音色描述', true);
                return;
            }

            const btn = document.getElementById('generateBtn');
            const btnText = document.getElementById('btnText');
            VersTTS.setButtonLoading(btn, btnText, true);

            try {
                const formData = new FormData();
                formData.append('text', genText);
                formData.append('model_size', modelSize);
                formData.append('mode', currentMode);

                if (instructText) formData.append('instruct_text', instructText);

                if (currentMode === 'voice_clone') {
                    const refAudio = document.getElementById('refAudio').files[0];
                    const refText = document.getElementById('refText').value.trim();
                    if (refAudio) formData.append('ref_audio', refAudio);
                    if (refText) formData.append('ref_text', refText);
                } else if (currentMode === 'custom_voice') {
                    formData.append('speaker', selectedSpeaker);
                } else if (currentMode === 'voice_design') {
                    formData.append('voice_design_prompt', document.getElementById('voiceDesignPrompt').value.trim());
                }

                const data = await VersTTS.postForm('/tts/qwen3tts', formData);

                if (data.success) {
                    VersTTS.showResult(data, { filename: `qwen3tts_${Date.now()}.wav` });
                    VersTTS.showStatus('语音生成成功！');
                } else {
                    throw new Error(data.message || '生成失败');
                }
            } catch (error) {
                VersTTS.showStatus('生成失败: ' + error.message, true);
            } finally {
                VersTTS.setButtonLoading(btn, btnText, false);
            }
        }

        document.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>
</html>
