<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoxCPM - VersTTS</title>
    <link rel="stylesheet" href="../assets/css/common.css?v=6">
    <style>
        .voxcpm-theme { --primary-color: #8bc34a; }
        .btn-generate.voxcpm { background: linear-gradient(135deg, #8bc34a 0%, #689f38 100%); }
        .btn-generate.voxcpm:hover { box-shadow: 0 8px 25px rgba(139, 195, 74, 0.4); }
        .mode-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #e0e0e0; flex-wrap: wrap; }
        .mode-tab { padding: 10px 20px; background: none; border: none; cursor: pointer; font-size: 0.95rem; color: #666; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.3s; }
        .mode-tab.active { color: #8bc34a; border-bottom-color: #8bc34a; font-weight: 600; }
        .mode-content { display: none; }
        .mode-content.active { display: block; }
        .speaker-section { margin-bottom: 20px; padding: 15px; background: #f1f8e9; border-radius: 8px; border-left: 4px solid #8bc34a; }
        .speaker-select-wrapper { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
        .speaker-select { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; background: white; }
        .param-section { margin-bottom: 20px; padding: 15px; background: #fafafa; border-radius: 8px; }
        .param-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .param-item { display: flex; flex-direction: column; }
        .param-item label { font-size: 0.9rem; color: #666; margin-bottom: 5px; font-weight: 500; }
        .param-item input, .param-item select { padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
        .info-box { background: #f1f8e9; border-left: 4px solid #8bc34a; padding: 12px; margin-bottom: 20px; border-radius: 4px; font-size: 0.9rem; color: #33691e; }
        .lang-badge { display: inline-block; background: #e8f5e9; color: #2e7d32; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; margin: 2px; }
        .speaker-info-display { margin-top: 10px; padding: 10px; background: white; border-radius: 6px; font-size: 0.85rem; color: #666; }
        .no-speaker-warning { color: #d97706; background: #fef3c7; padding: 10px; border-radius: 6px; margin-top: 10px; font-size: 0.9rem; }
        .voice-design-section { margin-bottom: 20px; padding: 15px; background: #f1f8e9; border-radius: 8px; border-left: 4px solid #8bc34a; }
    </style>
</head>
<body class="voxcpm-theme">
    <div class="sound-waves">
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
    </div>
    <div class="floating-notes">
        <div class="note">♪</div><div class="note">♫</div><div class="note">♬</div><div class="note">♭</div>
        <div class="note">♮</div><div class="note">♯</div><div class="note">𝎼</div><div class="note">𝄢</div>
    </div>

    <div class="app-container">
        <div class="header-actions">
            <div class="health-status">
                <div class="health-dot online" id="healthDot"></div>
                <span id="healthText">在线</span>
            </div>
        </div>
        <div class="container">
            <a href="../index.html" class="nav-back">← 返回模型列表</a>
            <header>
                <h1>🌐 VoxCPM</h1>
                <p>面壁智能 - 30种语言无Tokenizer TTS</p>
            </header>
            <div class="main-interface">
                <div class="model-badge"><span>🌐</span><span>VoxCPM</span></div>

                <div class="info-box">
                    💡 VoxCPM 支持 <strong>30种语言</strong> 的无Tokenizer语音合成，支持音色设计、声音克隆等多种模式。
                </div>

                <div id="statusMessage" class="status-message"></div>

                <div class="mode-tabs">
                    <button class="mode-tab active" onclick="switchVoxCPMMode('base')">基础生成</button>
                    <button class="mode-tab" onclick="switchVoxCPMMode('voice_design')">音色设计</button>
                    <button class="mode-tab" onclick="switchVoxCPMMode('clone')">声音克隆</button>
                    <button class="mode-tab" onclick="switchVoxCPMMode('ultimate_clone')">极致克隆</button>
                </div>

                <div id="mode-base" class="mode-content active">
                    <p style="color: #666; font-size: 0.9rem;">使用默认音色生成语音</p>
                </div>

                <div id="mode-voice_design" class="mode-content">
                    <div class="voice-design-section">
                        <label style="font-weight: 600; color: #33691e; display: block; margin-bottom: 10px;">音色描述</label>
                        <textarea id="voiceDesignPrompt" placeholder="用自然语言描述你想要的音色特征，例如：年轻女性，声音甜美，说话温柔..."></textarea>
                        <p style="font-size: 0.85rem; color: #666; margin-top: 8px;">详细描述想要的音色特征，越详细效果越好</p>
                    </div>
                </div>

                <div id="mode-clone" class="mode-content">
                    <div class="speaker-section">
                        <label style="font-weight: 600; color: #33691e; display: block; margin-bottom: 10px;">
                            🎙️ 选择说话人
                        </label>
                        <div class="speaker-select-wrapper">
                            <select id="speakerSelectClone" class="speaker-select" onchange="onSpeakerChange('clone')">
                                <option value="">-- 请选择说话人 --</option>
                            </select>
                        </div>
                        <div id="speakerInfoClone" class="speaker-info-display" style="display: none;">
                            <!-- 动态显示说话人信息 -->
                        </div>
                        <div id="noSpeakerWarningClone" class="no-speaker-warning" style="display: none;">
                            ⚠️ 暂无可用说话人，请先添加说话人
                        </div>
                    </div>
                </div>

                <div id="mode-ultimate_clone" class="mode-content">
                    <div class="speaker-section">
                        <label style="font-weight: 600; color: #33691e; display: block; margin-bottom: 10px;">
                            🎙️ 选择说话人
                        </label>
                        <div class="speaker-select-wrapper">
                            <select id="speakerSelectUltimate" class="speaker-select" onchange="onSpeakerChange('ultimate')">
                                <option value="">-- 请选择说话人 --</option>
                            </select>
                        </div>
                        <div id="speakerInfoUltimate" class="speaker-info-display" style="display: none;">
                            <!-- 动态显示说话人信息 -->
                        </div>
                        <div id="noSpeakerWarningUltimate" class="no-speaker-warning" style="display: none;">
                            ⚠️ 暂无可用说话人，请先添加说话人
                        </div>
                        <div id="refTextSection" style="margin-top: 15px; display: none;">
                            <label style="font-weight: 600; color: #33691e; display: block; margin-bottom: 8px;">参考文本</label>
                            <div id="refTextDisplay" style="padding: 10px; background: white; border-radius: 6px; font-size: 0.9rem; color: #666; font-style: italic; border: 1px solid #ddd;">
                                <!-- 显示参考文本 -->
                            </div>
                        </div>
                    </div>
                </div>

                <div class="input-section">
                    <label for="textInput">生成文本</label>
                    <textarea id="textInput" placeholder="请输入要转换为语音的文本，支持30种语言..."></textarea>
                </div>

                <div class="param-section">
                    <label style="font-weight: 600; margin-bottom: 15px; display: block;">生成参数</label>
                    <div class="param-grid">
                        <div class="param-item">
                            <label for="cfgValue">CFG值</label>
                            <input type="number" id="cfgValue" value="2.0" min="0.5" max="5.0" step="0.1">
                        </div>
                        <div class="param-item">
                            <label for="timesteps">推理步数</label>
                            <input type="number" id="timesteps" value="10" min="1" max="50" step="1">
                        </div>
                    </div>
                </div>

                <button class="btn-generate voxcpm" id="generateBtn" onclick="generateTTS()">
                    <span id="btnText">🎙️ 生成语音</span>
                </button>

                <div id="resultSection" class="result-section" style="display: none;">
                    <h3>🎵 生成结果</h3>
                    <audio id="audioPlayer" class="audio-player" controls></audio>
                    <a id="downloadLink" class="btn-download" href="#" download><span>⬇️</span><span>下载音频</span></a>
                </div>
            </div>
        </div>
    </div>

    <script src="../assets/js/common.js"></script>
    <script>
        let currentMode = 'base';
        let savedSpeakers = [];
        let selectedSpeakerId = { clone: null, ultimate: null };

        // 加载说话人列表
        async function loadSpeakers() {
            try {
                const response = await fetch(`${VersTTS.API_BASE}/speakers`);
                if (response.ok) {
                    const data = await response.json();
                    if (data.success) {
                        savedSpeakers = data.speakers || [];
                        renderSpeakerSelects();
                    }
                }
            } catch (error) {
                console.error('加载说话人列表失败:', error);
            }
        }

        // 渲染说话人选择下拉框
        function renderSpeakerSelects() {
            renderSpeakerSelect('speakerSelectClone', 'noSpeakerWarningClone');
            renderSpeakerSelect('speakerSelectUltimate', 'noSpeakerWarningUltimate');
        }

        function renderSpeakerSelect(selectId, warningId) {
            const select = document.getElementById(selectId);
            const warning = document.getElementById(warningId);

            // 保留第一个选项
            select.innerHTML = '<option value="">-- 请选择说话人 --</option>';

            if (savedSpeakers.length === 0) {
                warning.style.display = 'block';
                return;
            }

            warning.style.display = 'none';

            savedSpeakers.forEach(speaker => {
                const option = document.createElement('option');
                option.value = speaker.id;
                option.textContent = speaker.name;
                select.appendChild(option);
            });
        }

        // 说话人选择变化处理
        function onSpeakerChange(mode) {
            const selectId = mode === 'clone' ? 'speakerSelectClone' : 'speakerSelectUltimate';
            const infoId = mode === 'clone' ? 'speakerInfoClone' : 'speakerInfoUltimate';
            const select = document.getElementById(selectId);
            const speakerInfo = document.getElementById(infoId);

            selectedSpeakerId[mode] = select.value;

            if (selectedSpeakerId[mode]) {
                const speaker = savedSpeakers.find(s => s.id === selectedSpeakerId[mode]);
                if (speaker) {
                    let infoHtml = `<strong>已选择:</strong> ${speaker.name}<br>`;
                    infoHtml += `<small>创建于: ${formatDate(speaker.created_at)}</small>`;

                    if (speaker.reference_text) {
                        const refTextPreview = speaker.reference_text.substring(0, 50) + (speaker.reference_text.length > 50 ? '...' : '');
                        infoHtml += `<br><small>参考文本: ${refTextPreview}</small>`;
                    }

                    speakerInfo.innerHTML = infoHtml;
                    speakerInfo.style.display = 'block';

                    // 如果是ultimate模式，显示参考文本
                    if (mode === 'ultimate' && speaker.reference_text) {
                        document.getElementById('refTextSection').style.display = 'block';
                        document.getElementById('refTextDisplay').textContent = speaker.reference_text;
                    } else if (mode === 'ultimate') {
                        document.getElementById('refTextSection').style.display = 'none';
                    }
                }
            } else {
                speakerInfo.style.display = 'none';
                if (mode === 'ultimate') {
                    document.getElementById('refTextSection').style.display = 'none';
                }
            }
        }

        // 格式化日期
        function formatDate(isoString) {
            if (!isoString) return '';
            const date = new Date(isoString);
            return date.toLocaleDateString('zh-CN');
        }

        function switchVoxCPMMode(mode) {
            currentMode = mode;

            // 更新选项卡
            document.querySelectorAll('.mode-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');

            // 更新内容
            document.querySelectorAll('.mode-content').forEach(content => {
                content.classList.remove('active');
            });
            document.getElementById(`mode-${mode}`).classList.add('active');
        }

        async function generateTTS() {
            const text = document.getElementById('textInput').value.trim();
            const cfgValue = document.getElementById('cfgValue').value;
            const timesteps = document.getElementById('timesteps').value;

            if (!text) { VersTTS.showStatus('请输入生成文本', true); return; }

            if (currentMode === 'voice_design') {
                const prompt = document.getElementById('voiceDesignPrompt').value.trim();
                if (!prompt) { VersTTS.showStatus('请输入音色描述', true); return; }
            } else if (currentMode === 'clone') {
                if (!selectedSpeakerId.clone) { VersTTS.showStatus('请选择说话人', true); return; }
            } else if (currentMode === 'ultimate_clone') {
                if (!selectedSpeakerId.ultimate) { VersTTS.showStatus('请选择说话人', true); return; }
                const speaker = savedSpeakers.find(s => s.id === selectedSpeakerId.ultimate);
                if (!speaker || !speaker.reference_text) {
                    VersTTS.showStatus('选中的说话人没有参考文本，无法使用极致克隆模式', true);
                    return;
                }
            }

            const btn = document.getElementById('generateBtn');
            const btnText = document.getElementById('btnText');
            VersTTS.setButtonLoading(btn, btnText, true);

            try {
                const formData = new FormData();
                formData.append('text', text);
                formData.append('mode', currentMode);
                formData.append('cfg_value', cfgValue);
                formData.append('inference_timesteps', timesteps);

                // 调试信息
                console.log('【VoxCPM调试】当前模式:', currentMode);
                console.log('【VoxCPM调试】selectedSpeakerId:', selectedSpeakerId);

                if (currentMode === 'voice_design') {
                    formData.append('voice_design_prompt', document.getElementById('voiceDesignPrompt').value.trim());
                } else if (currentMode === 'clone') {
                    console.log('【VoxCPM调试】clone模式 - speaker_id:', selectedSpeakerId.clone);
                    formData.append('clone_speaker_id', selectedSpeakerId.clone);
                } else if (currentMode === 'ultimate_clone') {
                    console.log('【VoxCPM调试】ultimate_clone模式 - speaker_id:', selectedSpeakerId.ultimate);
                    formData.append('clone_speaker_id', selectedSpeakerId.ultimate);
                }

                // 打印FormData内容用于调试
                console.log('【VoxCPM调试】发送的FormData:');
                for (let [key, value] of formData.entries()) {
                    console.log(`  ${key}:`, value);
                }

                const data = await VersTTS.postForm('/tts/voxcpm', formData);

                if (data.success) {
                    VersTTS.showResult(data, { filename: `voxcpm_${Date.now()}.wav` });
                    VersTTS.showStatus('语音生成成功！');
                } else {
                    throw new Error(data.message || '生成失败');
                }
            } catch (error) {
                VersTTS.showStatus('生成失败: ' + error.message, true);
            } finally {
                VersTTS.setButtonLoading(btn, btnText, false);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            initPage();
            loadSpeakers();
        });
    </script>
</body>
</html>
